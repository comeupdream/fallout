<style id="css">
:root{
  --bg:#040906;
  --screen:#071309;
  --panel:#0a1a0e;
  --ink:#3dff7c;
  --mid:#25c95d;
  --dim:#128a3e;
  --dimmer:#0a5426;
  --line:#128a3e;
  --inv:#03120a;
  --amber:#ffc257;
  --font-d:"VT323","Share Tech Mono",ui-monospace,monospace;
  --font-m:"Share Tech Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-m);
  font-size:15px;
  line-height:1.45;
  text-transform:uppercase;
  letter-spacing:.02em;
}
body::before{ /* phosphor vignette */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}
body::after{ /* scanlines */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
.crt{max-width:1160px;margin:0 auto;padding:14px 14px 90px;position:relative;z-index:1;
  text-shadow:0 0 7px rgba(61,255,124,.38);
  animation:flick 7s infinite steps(1);
}
@keyframes flick{0%,100%{opacity:1}31%{opacity:.985}32%{opacity:1}67%{opacity:.99}68%{opacity:1}}
@media (prefers-reduced-motion: reduce){.crt{animation:none}}
button{font:inherit;color:inherit;background:none;border:none;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-shadow:inherit;padding:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.hdr{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:2px solid var(--line);padding:6px 2px 7px;flex-wrap:wrap}
.hdr .t{font-family:var(--font-d);font-size:30px;color:var(--ink)}
.hdr .t small{font-size:18px;color:var(--mid)}
.hdr .sys{font-size:12.5px;color:var(--dim)}
.hdr .sync{font-size:12.5px;color:var(--mid);border:1px solid var(--dim);padding:2px 8px}
.hdr .sync.warn{color:var(--amber);border-color:var(--amber)}

/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 4px;border-bottom:2px solid var(--line);padding-bottom:6px}
.tab{padding:4px 12px;font-family:var(--font-d);font-size:21px;color:var(--dim)}
.tab:hover{color:var(--mid)}
.tab.on{background:var(--ink);color:var(--inv);text-shadow:none}
.sub{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:7px 2px;color:var(--dim);font-size:12.5px}
.sub .chip{border:1px solid var(--dim);padding:2px 9px;color:var(--mid)}
.sub .chip.on{background:var(--mid);color:var(--inv);text-shadow:none}

/* main grid: list left, detail right — never overlapping */
.main{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:10px;align-items:start}
@media (max-width:780px){.main{grid-template-columns:1fr}}

.list{border:1px solid var(--dimmer);background:var(--screen);padding:6px}
.cathead{color:var(--dim);font-size:12px;padding:8px 8px 2px;letter-spacing:.14em}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;width:100%;text-align:left;padding:5px 8px;align-items:baseline;color:var(--mid)}
.row .bx{font-family:var(--font-m);color:var(--ink)}
.row .nm{white-space:normal}
.row .nm .tag{font-size:11px;color:var(--dim);border:1px solid var(--dimmer);padding:0 5px;margin-left:7px}
.row .nm .tag.safe{color:var(--amber);border-color:var(--amber)}
.row .est{font-family:var(--font-m);color:var(--dim);font-variant-numeric:tabular-nums}
.row:hover{background:rgba(61,255,124,.08)}
.row.sel{background:var(--ink);color:var(--inv);text-shadow:none}
.row.sel .bx,.row.sel .est,.row.sel .nm .tag{color:var(--inv);border-color:var(--inv)}
.row.done{color:var(--dimmer)}
.row.done .nm{text-decoration:line-through;text-decoration-thickness:1px}
.row.done .bx{color:var(--dim)}
.row.opt .nm{font-style:normal}
.row.opt{opacity:.75}

/* detail */
.det{border:1px solid var(--dimmer);background:var(--panel);padding:14px 16px;position:sticky;top:12px}
@media (max-width:780px){.det{position:static}}
.det h2{font-family:var(--font-d);font-size:27px;margin:0 0 8px;color:var(--ink);line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--dim)}
.kv dd{margin:0;color:var(--mid);font-variant-numeric:tabular-nums}
.det .note{color:var(--mid);font-size:13px;border-top:1px dashed var(--dimmer);padding-top:9px;margin-top:9px}
.det .note.safe{color:var(--amber)}
.bigbtn{display:block;width:100%;border:2px solid var(--ink);padding:9px 10px;margin-top:14px;font-family:var(--font-d);font-size:22px;text-align:center;color:var(--ink)}
.bigbtn:hover{background:var(--ink);color:var(--inv);text-shadow:none}
.bigbtn.undo{border-color:var(--dim);color:var(--dim)}

/* status tab */
.leaders{border:1px solid var(--dimmer);background:var(--screen);padding:14px 16px}
.leaders h2{font-family:var(--font-d);font-size:24px;margin:0 0 10px;color:var(--mid)}
.lrow{display:flex;align-items:baseline;gap:6px;padding:3px 0;width:100%;text-align:left;color:var(--mid)}
.lrow:hover .ln{color:var(--ink)}
.lrow .dots{flex:1;border-bottom:2px dotted var(--dimmer);transform:translateY(-4px)}
.lrow .pv{font-variant-numeric:tabular-nums;color:var(--ink)}
.nextup{margin-top:16px}
.nextup .nrow{display:flex;gap:10px;padding:3px 0;color:var(--mid);width:100%;text-align:left;align-items:baseline}
.nextup .nrow:hover{color:var(--ink)}
.nextup .nrow .tier{color:var(--dim);font-size:12px;border:1px solid var(--dimmer);padding:0 5px;white-space:nowrap}
.nextup .nrow .pr{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}

/* footer bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--inv);border-top:2px solid var(--line);padding:8px 14px;
 display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mid);text-shadow:0 0 7px rgba(61,255,124,.3)}
.foot .bar{flex:1;min-width:140px;height:13px;border:1px solid var(--dim);position:relative}
.foot .bar i{position:absolute;inset:1px auto 1px 1px;background:var(--ink);display:block}
.foot b{color:var(--ink);font-weight:normal;font-variant-numeric:tabular-nums}
.foot .keys{color:var(--dim);font-size:11.5px;letter-spacing:.08em}
@media (max-width:780px){.foot .keys{display:none}}
.hint{color:var(--dimmer);font-size:12px;margin-top:10px}
</style>

{i:"u12",c:"FUEL",n:"PIT COVER: COMPOST BIN / WOOD RACK",q:"1",e:50,t:"OPT",o:1,note:"HONEST-LOOKING COVER BESIDE THE PIT."},
{i:"p1",c:"PLUS",n:"BODY ARMOR, IIIA SOFT",q:"2 SETS",e:600,t:"OPT",o:1,note:"DEFERRED IN THE LEAN BUILD. RE-ENTRY PRICE WHEN READY; CERAMIC III/III+ IS THE $1,300 UPGRADE."},
{i:"p2",c:"PLUS",n:"PROPANE MONTHS 4–6 REFILL",q:"12× 20-LB",e:550,t:"OPT",o:1,note:"ONLY IF WINTER RUNS LONG — MARCH ONWARD THE WARM ROOM MOSTLY HOLDS ITSELF."},
{i:"p3",c:"PLUS",n:"HEIRLOOM SEED VAULT + GARDEN TOOLS",q:"SET",e:90,t:"OPT",o:1,note:"SPRING BUY. THE OFF-RAMP STARTS IN THE DIRT."},
{i:"p4",c:"PLUS",n:"CANNING STARTER",q:"SET",e:80,t:"OPT",o:1,note:"SPRING BUY — PAIRS WITH THE GARDEN."},
{i:"p5",c:"PLUS",n:"BARTER SMALLS: LIGHTERS + BATTERIES + AQUATABS",q:"LOT",e:80,t:"OPT",o:1,note:"TRADES BETTER PER POUND THAN GASOLINE."},
{i:"p6",c:"PLUS",n:"CASH RESERVE, SMALL BILLS",q:"$300–1,000",e:0,t:"OPT",o:1,note:"HELD, NOT SPENT. CARDS DIE WITH THE GRID."}
];
var CATS=["STATUS","FOOD","WATER","MED","WARM","GEAR","FUEL","PLUS"];
var CATLABEL={FOOD:"FOOD — 6 MONTHS",WATER:"WATER — 500 GAL + STACK",MED:"MED + HYGIENE",WARM:"COLD LAYER",GEAR:"GEAR + COMMS + SECURITY",FUEL:"HEAT + FUEL",PLUS:"DEFERRED / OPTIONAL"};
var TIERS={DONE:"BOUGHT",T0:"TIER 0 · FINISH FOOD+WATER",T1:"TIER 1 · COLD LAYER",T2:"TIER 2 · MED+HYGIENE",T3:"TIER 3 · HEAT",T4:"TIER 4 · COMMS",T5:"TIER 5 · GEAR",T6:"TIER 6 · FUEL+PIT",OPT:"OPTIONAL ADD-BACK"};
var TORDER=["DONE","T0","T1","T2","T3","T4","T5","T6","OPT"];

/* ---------- state ---------- */
var stateEl=document.getElementById("state");
var state={v:1,checked:{}};
try{var p=JSON.parse(stateEl.textContent);if(p&&p.checked)state=p;}catch(e){}
var art=null, artReady=false, tab="STATUS", sel=null, showOpt=true, saveT=null;

/* ---------- procedural audio (Web Audio, no files; device-local pref) ---------- */
var AC=null, sndOn=true;
try{ sndOn = localStorage.getItem("vault180_snd")!=="0"; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){AC=null;} } if(AC&&AC.state==="suspended"){ AC.resume().catch(function(){}); } return AC; }
function tone(f0,f1,dur,type,vol,delay){
  var a=ac(); if(!a||!sndOn)return;
  try{
    var t=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"square";
    o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
var sfx={
  tab:function(){ tone(180,0,0.05,"square",0.05); tone(1300,950,0.055,"square",0.032,0.014); },
  sel:function(){ tone(1050,1200,0.03,"square",0.028); },
  on:function(){ tone(880,1320,0.07,"square",0.055); tone(1760,0,0.05,"triangle",0.04,0.062); },
  off:function(){ tone(720,330,0.09,"square",0.05); }
};
function sndToggle(){ sndOn=!sndOn; try{localStorage.setItem("vault180_snd",sndOn?"1":"0");}catch(e){} render(); if(sndOn)sfx.tab(); }
function focusSel(){ var el=document.querySelector(".row.sel"); if(el)el.scrollIntoView({block:"nearest"}); }

function lsWrite(){try{localStorage.setItem("vault180",JSON.stringify(state));}catch(e){}}
function lsMerge(){try{var s=localStorage.getItem("vault180");if(s){var o=JSON.parse(s);if(o&&o.checked){for(var k in o.checked){state.checked[k]=o.checked[k];}}}}catch(e){}}

/* ---------- helpers ---------- */
function fmt(n){return "$"+n.toLocaleString("en-US");}
function leanItems(){return ITEMS.filter(function(x){return !x.o;});}
function leanTotal(){return leanItems().reduce(function(a,x){return a+x.e;},0);}
function secured(){return ITEMS.reduce(function(a,x){return a+(state.checked[x.i]?x.e:0);},0);}
function countChecked(){return ITEMS.filter(function(x){return state.checked[x.i];}).length;}
function catItems(c){return ITEMS.filter(function(x){return x.c===c&&(showOpt||!x.o);});}
function catPct(c){var it=ITEMS.filter(function(x){return x.c===c&&!x.o;});var t=it.reduce(function(a,x){return a+x.e;},0);var s=it.reduce(function(a,x){return a+(state.checked[x.i]?x.e:0);},0);return t?Math.round(100*s/t):0;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- persistence ---------- */
function buildDoc(){
  var css=document.getElementById("css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Vault 180</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap\">\n<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script id=\"state\" type=\"application/json\">"+json+"<\/script>\n<script id=\"app\">"+app+"<\/script>\n</body>\n</html>";
}
function setSync(txt,warn){var el=document.getElementById("sync");if(el){el.textContent="HOLOTAPE: "+txt;el.className="sync"+(warn?" warn":"");}}
function persist(){
  lsWrite();
  if(art){
    setSync("WRITING…");
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      art.publish(buildDoc()).then(function(){setSync("SYNCED");})
      .catch(function(e){ if(e&&(e.code==="conflict")){/* view reloads to winner */} else {setSync("LOCAL ONLY",true);} });
    },1600);
  } else {
    setSync(artReady?"LOCAL ONLY":"LOCAL",!artReady?false:true);
  }
}

/* ---------- render ---------- */
function render(){
  var root=document.getElementById("root");
  var lt=leanTotal(), sec=secured();
  var optSum=ITEMS.filter(function(x){return x.o;}).reduce(function(a,x){return a+x.e;},0);
  var h='<div class="crt">';
  h+='<header class="hdr"><span class="t">VAULT 180 <small>· SUPPLY LEDGER</small></span>'
   +'<span class="sys">2 ADULTS · 180 DAYS · REV 2026-08-29</span>'
   +'<span class="sync" id="sync">HOLOTAPE: …</span>'
   +'<button class="sync" id="sndbtn" aria-pressed="'+sndOn+'" title="toggle sound (S)">SND: '+(sndOn?"ON":"OFF")+'</button></header>';
  h+='<nav class="tabs">'+CATS.map(function(c){return '<button class="tab'+(tab===c?" on":"")+'" data-tab="'+c+'">'+c+'</button>';}).join("")+'</nav>';
  if(tab!=="STATUS"){
    h+='<div class="sub"><span>'+esc(CATLABEL[tab]||"")+'</span>'
     +'<button class="chip'+(showOpt?" on":"")+'" id="optchip">'+(showOpt?"OPTIONAL: SHOWN":"OPTIONAL: HIDDEN")+'</button>'
     +'<span>⚠ = SAFETY-CRITICAL, NEVER CUT</span></div>';
    h+='<div class="main"><div class="list" role="list">';
    var its=catItems(tab);
    h+=its.map(function(x){
      var ck=!!state.checked[x.i];
      return '<button class="row'+(ck?" done":"")+(sel===x.i?" sel":"")+(x.o?" opt":"")+'" data-id="'+x.i+'" role="listitem" aria-pressed="'+(sel===x.i)+'">'
        +'<span class="bx" data-box="'+x.i+'" role="checkbox" aria-checked="'+ck+'" aria-label="mark '+esc(x.n)+'">'+(ck?"[X]":"[&nbsp;&nbsp;]")+'</span>'
        +'<span class="nm">'+esc(x.n)
        +(x.s?'<span class="tag safe">⚠</span>':"")
        +(x.o?'<span class="tag">OPT</span>':"")
        +'</span><span class="est">'+(x.e?fmt(x.e):"—")+'</span></button>';
    }).join("");
    h+='</div>';
    var d=ITEMS.find(function(x){return x.i===sel&&x.c===tab;});
    h+='<aside class="det">';
    if(d){
      var ck2=!!state.checked[d.i];
      h+='<h2>'+esc(d.n)+'</h2><dl class="kv">'
        +'<dt>QTY</dt><dd>'+esc(d.q)+'</dd>'
        +'<dt>EST</dt><dd>'+(d.e?fmt(d.e):"HELD, NOT SPENT")+'</dd>'
        +'<dt>TIER</dt><dd>'+esc(TIERS[d.t]||d.t)+'</dd>'
        +'<dt>STATUS</dt><dd>'+(ck2?"SECURED":"OUTSTANDING")+'</dd></dl>'
        +(d.note?'<p class="note'+(d.s?" safe":"")+'">'+esc(d.note)+'</p>':"")
        +'<button class="bigbtn'+(ck2?" undo":"")+'" data-toggle="'+d.i+'">'+(ck2?"[ MARK OUTSTANDING ]":"[ MARK SECURED ]")+'</button>';
    } else {
      var its2=ITEMS.filter(function(x){return x.c===tab&&!x.o;});
      var ct=its2.reduce(function(a,x){return a+x.e;},0);
      var cs=its2.reduce(function(a,x){return a+(state.checked[x.i]?x.e:0);},0);
      h+='<h2>'+esc(tab)+' STATUS</h2><dl class="kv">'
        +'<dt>SECURED</dt><dd>'+fmt(cs)+' / '+fmt(ct)+'</dd>'
        +'<dt>ITEMS</dt><dd>'+its2.filter(function(x){return state.checked[x.i];}).length+' / '+its2.length+'</dd></dl>'
        +'<p class="note">SELECT AN ITEM FOR ITS DATA CARD. CLICK THE [ ] BOX TO MARK IT SECURED.</p>';
    }
    h+='</aside></div>';
  } else {
    h+='<div class="sub"><span>ALLOCATION OVERVIEW — LEAN BUILD ACTIVE</span></div>';
    h+='<div class="main"><div class="leaders"><h2>SUPPLY ALLOCATIONS</h2>';
    h+=["FOOD","WATER","MED","WARM","GEAR","FUEL"].map(function(c){
      return '<button class="lrow" data-go="'+c+'"><span class="ln">'+c+'</span><span class="dots"></span><span class="pv">'+catPct(c)+'%</span></button>';
    }).join("");
    h+='<div class="nextup"><h2>NEXT ACQUISITIONS</h2>';
    var next=TORDER.reduce(function(acc,t){
      if(acc.length>=6)return acc;
      ITEMS.forEach(function(x){if(acc.length<6&&x.t===t&&!x.o&&!state.checked[x.i])acc.push(x);});
      return acc;
    },[]);
    h+=next.length?next.map(function(x){return '<button class="nrow" data-goto="'+x.i+'"><span class="tier">'+esc(x.t)+'</span><span>'+esc(x.n)+'</span><span class="pr">'+fmt(x.e)+'</span></button>';}).join(""):'<p class="note">ALL LEAN-BUILD ITEMS SECURED. VAULT 180 IS STOCKED.</p>';
    h+='</div><p class="hint">FILE OF RECORD: PREPAREDNESS/LEDGER.MD · FULL PLAN: SIX-MONTH-WINTER-PLAN.MD</p></div>';
    h+='<aside class="det"><h2>VAULT 180</h2><dl class="kv">'
      +'<dt>LEAN BUILD</dt><dd>'+fmt(lt)+'</dd>'
      +'<dt>SECURED</dt><dd>'+fmt(sec)+'</dd>'
      +'<dt>OUTSTANDING</dt><dd>'+fmt(Math.max(0,lt-Math.min(sec,lt)))+'</dd>'
      +'<dt>OPTIONAL POOL</dt><dd>'+fmt(optSum)+'</dd>'
      +'<dt>CALORIES</dt><dd>~1.03M ON HAND AT FULL BUILD</dd>'
      +'<dt>WATER</dt><dd>500 GAL STORED + STACK</dd></dl>'
      +'<p class="note">ONE KIT MEAL PER PERSON PER DAY. ONE JUG PER DAY. HEATER SLEEPS OFF. ZERO GASOLINE INDOORS. DRINK TO THIRST.</p></aside></div>';
  }
  var pct=Math.min(100,Math.round(100*sec/lt));
  h+='</div><footer class="foot"><span>SECURED <b>'+fmt(sec)+'</b> / '+fmt(lt)+' LEAN</span>'
    +'<span class="bar" role="img" aria-label="'+pct+' percent of lean build secured"><i style="width:'+pct+'%"></i></span>'
    +'<span><b>'+pct+'%</b></span><span>ITEMS <b>'+countChecked()+'</b>/'+ITEMS.length+'</span>'
    +'<span class="keys">◄ ► TABS · ▲ ▼ SELECT · ⏎ SECURE · S SND</span></footer>';
  root.innerHTML=h;
  setSync(art?"SYNCED":(artReady?"LOCAL ONLY":"LOCAL"), art?false:artReady);
}

/* ---------- events (delegated) ---------- */
function toggleItem(id){
  state.checked[id]=!state.checked[id];
  var on=!!state.checked[id];
  if(!on)delete state.checked[id];
  render();persist();
  if(on)sfx.on();else sfx.off();
  return on;
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-box]");
  if(t){toggleItem(t.getAttribute("data-box"));ev.stopPropagation();return;}
  var tg=ev.target.closest("[data-toggle]");
  if(tg){toggleItem(tg.getAttribute("data-toggle"));return;}
  var r=ev.target.closest(".row");
  if(r){sel=(sel===r.getAttribute("data-id"))?null:r.getAttribute("data-id");render();sfx.sel();return;}
  var tb=ev.target.closest("[data-tab]");
  if(tb){tab=tb.getAttribute("data-tab");sel=null;render();sfx.tab();return;}
  var go=ev.target.closest("[data-go]");
  if(go){tab=go.getAttribute("data-go");sel=null;render();sfx.tab();return;}
  var gt=ev.target.closest("[data-goto]");
  if(gt){var it=ITEMS.find(function(x){return x.i===gt.getAttribute("data-goto");});if(it){tab=it.c;sel=it.i;render();sfx.tab();}return;}
  var oc=ev.target.closest("#optchip");
  if(oc){showOpt=!showOpt;render();sfx.sel();return;}
  var sb=ev.target.closest("#sndbtn");
  if(sb){sndToggle();return;}
});

/* ---------- keyboard: ◄ ► tabs · ▲ ▼ select · enter/space secure · s sound ---------- */
document.addEventListener("keydown",function(ev){
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var k=ev.key;
  if(k==="ArrowLeft"||k==="ArrowRight"||k==="["||k==="]"){
    var d=(k==="ArrowLeft"||k==="[")?-1:1;
    tab=CATS[(CATS.indexOf(tab)+d+CATS.length)%CATS.length];
    sel=null;render();sfx.tab();ev.preventDefault();return;
  }
  if(k==="s"||k==="S"){sndToggle();return;}
  if(tab==="STATUS")return;
  var its=catItems(tab);
  if((k==="ArrowDown"||k==="ArrowUp")&&its.length){
    var pos=-1;for(var j=0;j<its.length;j++){if(its[j].i===sel){pos=j;break;}}
    var np;
    if(pos<0){np=(k==="ArrowDown")?0:its.length-1;}
    else{np=Math.min(its.length-1,Math.max(0,pos+((k==="ArrowDown")?1:-1)));}
    sel=its[np].i;render();sfx.sel();focusSel();ev.preventDefault();return;
  }
  if((k==="Enter"||k===" ")&&sel){
    toggleItem(sel);focusSel();ev.preventDefault();return;
  }
});

/* ---------- boot ---------- */
render();
(function(){
  var use=(window.claude&&window.claude.use)?window.claude.use("artifact"):Promise.resolve(null);
  Promise.resolve(use).then(function(ns){art=ns;artReady=true;if(!art)lsMerge();render();})
  .catch(function(){art=null;artReady=true;lsMerge();render();});
})();
})();
</script>
